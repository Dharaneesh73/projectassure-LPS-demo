<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Project Assure — Last Planner System®</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" async onerror="window._xlsxFailed=true"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js" async onerror="window._chartFailed=true"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f5f7;--surf:#ffffff;--surf2:#f8f9fb;--bd:#e8eaed;--bd2:#d1d5db;
  --tx:#111827;--tx2:#374151;--tx3:#6b7280;--tx4:#9ca3af;
  --pu:#6d28d9;--pu-l:#f5f3ff;--pu-b:#ddd6fe;--pu-d:#5b21b6;
  --bl:#2563eb;--gn:#047857;--gn-l:#ecfdf5;--gn-b:#a7f3d0;
  --rd:#dc2626;--rd-l:#fef2f2;--rd-b:#fca5a5;
  --am:#b45309;--am-l:#fffbeb;--am-b:#fde68a;
  --grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 50%,#9333ea 100%);
  --grad2:linear-gradient(135deg,#1e40af 0%,#4f46e5 100%);
  --sh:0 1px 2px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.1);
  --sh-md:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -1px rgba(0,0,0,.06);
  --sh-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05);
  --sh-xl:0 20px 25px -5px rgba(0,0,0,.1),0 10px 10px -5px rgba(0,0,0,.04);
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --r4:4px;--r6:6px;--r8:8px;--r12:12px;--r16:16px;
}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body{font-family:var(--font);font-size:13.5px;line-height:1.5;color:var(--tx);background:var(--bg);min-height:100vh}

/* ── TYPOGRAPHY SCALE ── */
.t-xs{font-size:11px;line-height:1.4}
.t-sm{font-size:12px;line-height:1.4}
.t-base{font-size:13.5px;line-height:1.5}
.t-md{font-size:15px;line-height:1.5}
.t-lg{font-size:17px;line-height:1.4}
.t-xl{font-size:20px;line-height:1.3;letter-spacing:-0.01em}
.t-2xl{font-size:24px;line-height:1.3;letter-spacing:-0.02em}
.t-3xl{font-size:30px;line-height:1.2;letter-spacing:-0.025em}
.t-4xl{font-size:36px;line-height:1.1;letter-spacing:-0.03em}
.t-5xl{font-size:48px;line-height:1;letter-spacing:-0.04em}
.fw-4{font-weight:400}.fw-5{font-weight:500}.fw-6{font-weight:600}.fw-7{font-weight:700}.fw-8{font-weight:800}.fw-9{font-weight:900}
.tracking-tight{letter-spacing:-0.025em}
.tracking-wide{letter-spacing:0.05em}
.tracking-wider{letter-spacing:0.1em}
.uppercase{text-transform:uppercase}
.mono{font-family:var(--mono)}

/* ── AUTH SCREENS ── */
.auth-shell{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(145deg,#0f0720 0%,#1e1b4b 40%,#1e3a5f 100%);padding:24px;position:relative;overflow:hidden}
.auth-glow{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(109,40,217,.3) 0%,transparent 70%);pointer-events:none}
.auth-glow-1{top:-200px;right:-100px}
.auth-glow-2{bottom:-200px;left:-100px;background:radial-gradient(circle,rgba(37,99,235,.2) 0%,transparent 70%)}
.auth-card{background:rgba(255,255,255,.97);border-radius:20px;padding:40px;width:100%;max-width:440px;box-shadow:0 32px 64px rgba(0,0,0,.4);position:relative;z-index:1;backdrop-filter:blur(10px)}
.auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.auth-logo img{height:48px;width:48px;object-fit:cover;border-radius:11px;display:block}
.auth-logo-text .brand{font-size:18px;font-weight:800;letter-spacing:-0.03em;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.auth-logo-text .sub{font-size:11px;font-weight:500;color:var(--tx3);letter-spacing:0.06em;text-transform:uppercase;margin-top:1px}
.auth-title{font-size:22px;font-weight:700;letter-spacing:-0.025em;color:var(--tx);margin-bottom:6px}
.auth-sub{font-size:13.5px;color:var(--tx3);margin-bottom:28px;font-weight:400}
.auth-tabs{display:flex;gap:0;background:#f3f4f6;border-radius:8px;padding:3px;margin-bottom:24px}
.auth-tab{flex:1;padding:7px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;text-align:center;border:none;background:transparent;color:var(--tx3);transition:.2s;font-family:var(--font)}
.auth-tab.on{background:#fff;color:var(--tx);box-shadow:var(--sh)}

/* Plans */
.plan-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
.plan-card{border:2px solid var(--bd);border-radius:12px;padding:16px;cursor:pointer;transition:.2s;position:relative}
.plan-card:hover{border-color:var(--pu-b);background:var(--pu-l)}
.plan-card.on{border-color:var(--pu);background:var(--pu-l)}
.plan-badge{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--grad);color:#fff;font-size:10px;font-weight:700;padding:2px 10px;border-radius:20px;white-space:nowrap;letter-spacing:0.04em}
.plan-name{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:2px}
.plan-price{font-size:18px;font-weight:800;letter-spacing:-0.025em;color:var(--pu);margin-bottom:6px}
.plan-price span{font-size:11px;font-weight:400;color:var(--tx3)}
.plan-feat{font-size:11px;color:var(--tx3);line-height:1.6}

/* ── PROJECT SELECTOR ── */
.proj-shell{min-height:100vh;background:var(--bg)}
.proj-topbar{background:#fff;border-bottom:1px solid var(--bd);padding:0 24px;height:60px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh)}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:24px;max-width:1200px;margin:0 auto}
.proj-card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:22px;cursor:pointer;transition:.2s;box-shadow:var(--sh);position:relative;overflow:hidden}
.proj-card:hover{box-shadow:var(--sh-md);border-color:var(--pu-b);transform:translateY(-1px)}
.proj-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad)}
.proj-card-new{border-style:dashed;border-color:var(--bd2);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:140px;color:var(--tx3)}
.proj-card-new:hover{border-color:var(--pu);color:var(--pu);background:var(--pu-l)}
.proj-name{font-size:16px;font-weight:700;letter-spacing:-0.02em;color:var(--tx);margin-bottom:4px}
.proj-meta{font-size:12px;color:var(--tx3);margin-bottom:14px;font-weight:400}
.proj-stat{display:flex;gap:14px}
.ps-item{text-align:center}
.ps-v{font-size:22px;font-weight:800;letter-spacing:-0.02em;color:var(--tx)}
.ps-l{font-size:10px;font-weight:500;color:var(--tx3);text-transform:uppercase;letter-spacing:0.06em}

/* ── CREDIT BAR ── */
.credit-bar-wrap{background:#f8f9fb;border:1px solid var(--bd);border-radius:8px;padding:12px 14px}
.credit-track{background:#e5e7eb;border-radius:4px;height:6px;overflow:hidden;margin:6px 0}
.credit-fill{height:100%;border-radius:4px;transition:width .6s;background:var(--grad)}
.credit-fill.warn{background:linear-gradient(90deg,#f59e0b,#ef4444)}

/* ── MAIN APP HEADER ── */
.hdr{background:#0a0d1a;padding:0 20px;height:54px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:500;border-bottom:1px solid rgba(255,255,255,.06)}

.brand-mark .b1{font-size:14px;font-weight:800;letter-spacing:-0.02em;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.brand-mark .b2{font-size:9px;font-weight:500;color:#6b7280;letter-spacing:0.12em;text-transform:uppercase;margin-top:1px}
.hdr-sep{width:1px;height:22px;background:rgba(255,255,255,.1);flex-shrink:0}
.hdr-proj-name{font-size:13px;font-weight:600;color:#f9fafb;letter-spacing:-0.01em}
.hdr-proj-meta{font-size:10px;color:#6b7280;font-family:var(--mono)}
.hd-r{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}

/* Data Date Navigator — compact, refined */
.dd-nav{display:flex;align-items:center;background:rgba(255,255,255,.06);border-radius:8px;border:1px solid rgba(255,255,255,.1);overflow:hidden}
.dd-btn{background:none;border:none;color:#9ca3af;cursor:pointer;padding:5px 10px;font-size:14px;font-weight:600;transition:.15s;font-family:var(--font)}
.dd-btn:hover{background:rgba(255,255,255,.08);color:#f9fafb}
.dd-center{padding:5px 12px;text-align:center;border-left:1px solid rgba(255,255,255,.1);border-right:1px solid rgba(255,255,255,.1);cursor:pointer;min-width:110px}
.dd-wk{font-size:13px;font-weight:700;color:#e0e7ff;letter-spacing:0.02em;font-family:var(--mono)}
.dd-dt{font-size:10px;color:#6b7280;margin-top:1px;font-family:var(--mono)}

/* Window size selector */
.win-sel{display:flex;gap:1px;background:rgba(255,255,255,.06);border-radius:7px;padding:2px;border:1px solid rgba(255,255,255,.1)}
.ws-b{padding:4px 9px;border-radius:5px;font-size:11px;font-weight:600;border:none;cursor:pointer;font-family:var(--font);transition:.2s;color:#9ca3af;background:transparent;letter-spacing:0.02em}
.ws-b:hover{color:#e0e7ff;background:rgba(255,255,255,.06)}
.ws-b.on{background:var(--pu);color:#fff;font-weight:700;box-shadow:0 1px 4px rgba(109,40,217,.4)}

/* ── NAV TABS ── */
.nav{background:#fff;border-bottom:1px solid var(--bd);display:flex;padding:0 20px;overflow-x:auto;position:sticky;top:54px;z-index:400}
.tab{padding:12px 14px;font-size:12.5px;font-weight:500;color:var(--tx3);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;font-family:var(--font);transition:.15s;display:inline-flex;align-items:center;gap:6px;letter-spacing:-0.01em}
.tab:hover{color:var(--tx);background:#f9fafb}
.tab.on{color:var(--pu);border-bottom-color:var(--pu);font-weight:600}
.tnb{background:var(--rd);color:#fff;font-size:10px;padding:1px 5px;border-radius:9px;font-weight:700;font-family:var(--font)}

/* ── MAIN ── */
.main{padding:20px;max-width:100%;padding-bottom:72px}

/* ── GUIDE BAR ── */
.guide{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;z-index:200;border-top:1px solid var(--bd);box-shadow:0 -4px 12px rgba(0,0,0,.06)}
.g-ico{font-size:16px;flex-shrink:0}.g-txt{flex:1;font-size:12.5px;color:var(--tx2);line-height:1.4;font-weight:400}.g-txt strong{color:var(--tx);font-weight:600}
.g-acts{display:flex;gap:7px;flex-shrink:0}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.15s;white-space:nowrap;font-family:var(--font);letter-spacing:-0.01em;line-height:1}
.btn-pr{background:var(--grad);color:#fff;box-shadow:0 1px 3px rgba(109,40,217,.3)}.btn-pr:hover{opacity:.9}
.btn-ok{background:var(--gn);color:#fff}.btn-ok:hover{background:#065f46}
.btn-rd{background:var(--rd);color:#fff}
.btn-pu{background:var(--pu);color:#fff}.btn-pu:hover{background:var(--pu-d)}
.btn-ol{background:#fff;color:var(--tx2);border:1px solid var(--bd2);box-shadow:var(--sh)}.btn-ol:hover{background:var(--surf2)}
.btn-gh{background:transparent;color:var(--tx3);border:1px solid var(--bd)}.btn-gh:hover{background:var(--surf2);color:var(--tx)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-lg{padding:10px 20px;font-size:14px}
.btn-xl{padding:12px 22px;font-size:15px;border-radius:8px}
.btn-fw{width:100%;justify-content:center}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ── INPUT / FORM ── */
.fi,.fs{width:100%;padding:8px 11px;border:1px solid var(--bd2);border-radius:7px;font-size:13.5px;color:var(--tx);background:#fff;outline:none;transition:.15s;font-family:var(--font);font-weight:400;letter-spacing:-0.01em}
.fi:focus,.fs:focus{border-color:var(--pu);box-shadow:0 0 0 3px rgba(109,40,217,.12)}
.fi::placeholder{color:var(--tx4);font-weight:400}
.flbl{display:block;font-size:12px;font-weight:500;color:var(--tx2);margin-bottom:5px;letter-spacing:-0.005em}
.fg{margin-bottom:14px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* ── CARD ── */
.card{background:#fff;border-radius:var(--r12);border:1px solid var(--bd);box-shadow:var(--sh)}
.card-hdr{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-t{font-size:14px;font-weight:600;letter-spacing:-0.02em;color:var(--tx);display:flex;align-items:center;gap:7px}
.card-body{padding:18px}

/* ── KPI ── */
.krow{display:grid;gap:10px;margin-bottom:16px}
.k5{grid-template-columns:repeat(5,1fr)}.k4{grid-template-columns:repeat(4,1fr)}.k3{grid-template-columns:repeat(3,1fr)}.k2{grid-template-columns:repeat(2,1fr)}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:var(--r12);padding:14px 16px;border-left:3px solid var(--pu);box-shadow:var(--sh);transition:.2s}
.kpi:hover{box-shadow:var(--sh-md)}
.kpi-l{font-size:11px;font-weight:500;color:var(--tx3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px}
.kpi-v{font-size:30px;font-weight:800;letter-spacing:-0.03em;line-height:1;margin-bottom:4px}
.kpi-s{font-size:11.5px;color:var(--tx3);font-weight:400}

/* ── BADGE ── */
.bdg{display:inline-flex;align-items:center;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600;letter-spacing:0.01em;white-space:nowrap}
.b-ok{background:var(--gn-l);color:var(--gn);border:1px solid var(--gn-b)}.b-ng{background:var(--rd-l);color:var(--rd);border:1px solid var(--rd-b)}
.b-wr{background:var(--am-l);color:var(--am);border:1px solid var(--am-b)}.b-pu{background:var(--pu-l);color:var(--pu);border:1px solid var(--pu-b)}.b-gr{background:#f3f4f6;color:#6b7280;border:1px solid #e5e7eb}

/* ── INFOBOX ── */
.ib{padding:11px 14px;border-radius:9px;font-size:13px;line-height:1.6;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;font-weight:400}
.ib-pu{background:var(--pu-l);border:1px solid var(--pu-b);color:#5b21b6}.ib-bl{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.ib-ok{background:var(--gn-l);border:1px solid var(--gn-b);color:#065f46}.ib-ng{background:var(--rd-l);border:1px solid var(--rd-b);color:#991b1b}
.ib-wr{background:var(--am-l);border:1px solid var(--am-b);color:#92400e}.ib-ico{font-size:15px;flex-shrink:0;margin-top:2px}

/* ── MODAL ── */
.ml-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.ml-bx{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:var(--sh-xl)}
.ml-hdr{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1;border-radius:16px 16px 0 0}
.ml-t{font-size:16px;font-weight:700;letter-spacing:-0.02em;color:var(--tx)}.ml-body{padding:20px}
.ml-ftr{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.ml-x{background:none;border:none;cursor:pointer;color:var(--tx3);width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px;transition:.15s}.ml-x:hover{background:var(--bg);color:var(--tx)}
.hi{display:none!important}

/* ── GANTT ── */
.g-shell{display:flex;height:calc(100vh - 200px);min-height:360px;border:1px solid var(--bd);border-radius:12px;overflow:hidden;box-shadow:var(--sh-md);background:#fff}
.g-sb{width:214px;flex-shrink:0;border-right:1px solid var(--bd);display:flex;flex-direction:column;background:#f9fafb}
.g-sb-hdr{padding:10px 12px;border-bottom:1px solid var(--bd);background:#fff}
.g-sb-t{font-size:11.5px;font-weight:600;color:var(--tx);letter-spacing:-0.01em}
.g-sb-s{font-size:11px;color:var(--tx4);margin-top:1px;font-weight:400}.g-sb-body{flex:1;overflow-y:auto;padding:8px}
.uc{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:9px 10px;margin-bottom:6px;cursor:grab;border-left:3px solid #c4b5fd;transition:.15s;user-select:none}
.uc:hover{box-shadow:var(--sh-md);border-left-color:var(--pu);background:var(--pu-l);transform:translateX(1px)}
.uc:active{cursor:grabbing}
.uc-id{font-size:10px;font-family:var(--mono);font-weight:600;color:var(--pu);margin-bottom:1px}
.uc-nm{font-size:12px;font-weight:600;color:var(--tx);margin-bottom:3px;line-height:1.3;letter-spacing:-0.01em}.uc-tr{font-size:10.5px;color:var(--tx3);font-weight:400}
.g-main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.g-tb{padding:8px 12px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;background:#fff;flex-shrink:0;flex-wrap:wrap}
.g-area{flex:1;overflow:auto;position:relative;cursor:default}
.g-inner{position:relative}
/* Gantt Header */
.g-hdr{display:flex;background:#f9fafb;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:50}
.g-lhdr{padding:0 12px;font-size:10.5px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:0.06em;border-right:1px solid var(--bd);display:flex;align-items:center;flex-shrink:0}
.g-thdr{position:relative;flex:1}
.g-mband{position:absolute;top:0;height:20px;display:flex;align-items:center;padding:0 6px;font-size:10px;font-weight:500;color:var(--tx3);border-left:1px solid var(--bd);background:#f9fafb;font-family:var(--mono);overflow:hidden}
.g-wband{position:absolute;bottom:0;height:18px;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--bd);font-family:var(--mono);overflow:hidden;flex-direction:column}
.gwn{font-size:8px;font-weight:600;line-height:1;letter-spacing:0.02em}.gwd{font-size:7px;color:var(--tx4);line-height:1}
/* Gantt rows */
.g-row{display:flex;border-bottom:1px solid #f3f4f6;align-items:stretch}
.g-row:nth-child(odd){background:#fff}.g-row:nth-child(even){background:#fcfcfd}
.g-row:hover{background:#fafafe}
.g-lbl{padding:5px 12px;border-right:1px solid var(--bd);display:flex;flex-direction:column;justify-content:center;flex-shrink:0;min-height:40px}
.g-lid{font-size:9.5px;font-family:var(--mono);font-weight:600;color:var(--pu);margin-bottom:2px}
.g-lnm{font-size:11.5px;font-weight:600;color:var(--tx);line-height:1.25;letter-spacing:-0.01em}
.g-ltr{font-size:10px;color:var(--tx3);font-weight:400;margin-top:1px}
.g-tl{flex:1;position:relative;min-height:40px;overflow:visible}
.g-gl{position:absolute;top:0;bottom:0;width:1px;background:#f3f4f6;pointer-events:none;z-index:3}
/* Window boundary — clear and prominent */
.g-win-hl{position:absolute;top:0;bottom:0;background:rgba(109,40,217,.05);pointer-events:none;z-index:6}
.g-past-ov{position:absolute;top:0;bottom:0;background:rgba(0,0,0,.025);pointer-events:none;z-index:5;border-right:2px solid var(--pu)}
.g-future-ov{position:absolute;top:0;bottom:0;background:rgba(0,0,0,.025);pointer-events:none;z-index:5;border-left:2px dashed rgba(109,40,217,.4)}
/* Line markers */
.g-now-line{position:absolute;top:0;bottom:0;width:2px;background:var(--rd);z-index:30;pointer-events:none}
.g-now-dot{position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:8px;height:8px;background:var(--rd);border-radius:50%;border:2px solid #fff}
/* Gantt bars */
.g-bar{position:absolute;height:24px;border-radius:5px;cursor:grab;display:flex;align-items:center;padding:0 8px;font-size:10.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.2);z-index:15;transition:box-shadow .12s,filter .12s;user-select:none;letter-spacing:-0.01em}
.g-bar:hover{box-shadow:0 3px 10px rgba(0,0,0,.25);filter:brightness(1.07);z-index:25}
.g-bar.drag{cursor:grabbing;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:.9}
.g-rh{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:col-resize;display:flex;align-items:center;justify-content:center;opacity:0;transition:.15s}
.g-bar:hover .g-rh{opacity:1}
.g-rh::after{content:'⋮';color:rgba(255,255,255,.8);font-size:12px;line-height:1}
/* Date marker labels — compact, above lines */
.g-date-lbl{position:absolute;bottom:calc(100% + 2px);font-size:8.5px;font-weight:600;font-family:var(--mono);white-space:nowrap;transform:translateX(-50%);z-index:40;padding:1px 4px;border-radius:3px;line-height:1.4;pointer-events:none}
.g-lbl-now{background:var(--rd);color:#fff}
.g-lbl-ws{background:var(--pu);color:#fff}
.g-lbl-we{color:var(--pu);border:1px solid var(--pu);background:#fff}
.g-tip{position:fixed;background:#111827;color:#fff;padding:6px 10px;border-radius:7px;font-size:11.5px;font-weight:600;font-family:var(--mono);pointer-events:none;z-index:999;display:none;white-space:nowrap;box-shadow:var(--sh-lg);letter-spacing:-0.01em}
.g-empty{height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--tx4);font-size:13px;border:1.5px dashed var(--bd2);margin:12px;border-radius:10px}
/* ── BOARD ── */
.kb{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;align-items:flex-start}
.kc{min-width:200px;flex:1;display:flex;flex-direction:column}
.kc-hdr{border-radius:10px 10px 0 0;padding:10px 13px}
.kc-t{font-size:12px;font-weight:700;letter-spacing:-0.01em}.kc-s{font-size:11px;opacity:.7;margin-top:2px;font-weight:400}
.kc-body{background:#f9fafb;border:1px solid var(--bd);border-top:none;border-radius:0 0 10px 10px;padding:7px;min-height:220px;transition:.15s}
.kc-body.dov{background:var(--pu-l);border-color:var(--pu-b)}
/* Task card */
.tc{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:9px 11px;margin-bottom:6px;cursor:grab;border-left:3px solid #d1d5db;box-shadow:var(--sh);user-select:none;transition:.15s}
.tc:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}.tc:active{cursor:grabbing}
.tc-id{font-size:9.5px;color:var(--tx4);font-family:var(--mono);font-weight:500;margin-bottom:3px}
.tc-nm{font-size:12.5px;font-weight:600;color:var(--tx);margin-bottom:6px;line-height:1.3;letter-spacing:-0.01em}
.tc-tags{display:flex;flex-wrap:wrap;gap:4px}
.tc-tag{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;letter-spacing:0.01em}
.tc-con{margin-top:6px;font-size:10.5px;background:var(--am-l);color:var(--am);padding:4px 8px;border-radius:5px;border:1px solid var(--am-b);line-height:1.3;font-weight:400}
/* PPC gauge */
.ppc-g{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px 20px;margin-bottom:14px;display:flex;align-items:center;gap:20px;box-shadow:var(--sh)}
.ppc-num{font-weight:800;line-height:1;letter-spacing:-0.04em}
.ppc-lbl{font-size:10px;color:var(--tx3);margin-top:4px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em}
.ppc-area{flex:1}
.ppc-track{background:#e5e7eb;border-radius:4px;height:12px;position:relative;overflow:visible;margin:7px 0 10px}
.ppc-fill{height:100%;border-radius:4px;transition:width .6s;position:relative}
.ppc-fill::after{content:'';position:absolute;inset:0;border-radius:4px;background:linear-gradient(90deg,rgba(255,255,255,.0),rgba(255,255,255,.15))}
.ppc-stats{display:flex;gap:16px}
.ppc-sv{font-size:22px;font-weight:800;line-height:1;letter-spacing:-0.03em}
.ppc-sl{font-size:10px;color:var(--tx3);font-weight:500;text-transform:uppercase;letter-spacing:0.06em}
/* Charts */
.ch-box{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px;box-shadow:var(--sh)}
.ch-t{font-size:14px;font-weight:600;letter-spacing:-0.02em;color:var(--tx);margin-bottom:3px}.ch-s{font-size:11.5px;color:var(--tx3);margin-bottom:12px;font-weight:400}
/* Upload zone */
.uz{border:1.5px dashed var(--bd2);border-radius:10px;padding:30px 20px;text-align:center;cursor:pointer;transition:.2s;background:#fff}
.uz:hover,.uz.dov{border-color:var(--pu);background:var(--pu-l)}.uz-ico{font-size:36px;margin-bottom:8px;line-height:1}
.uz-t{font-size:15px;font-weight:600;letter-spacing:-0.02em;color:var(--tx);margin-bottom:4px}.uz-s{font-size:12px;color:var(--tx3);font-weight:400}
/* Settings */
.srow{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--bd)}.srow:last-child{border-bottom:none}
.slbl{flex:1}.sname{font-size:14px;font-weight:600;letter-spacing:-0.01em;color:var(--tx);margin-bottom:2px}.sdesc{font-size:12px;color:var(--tx3);font-weight:400}
.range-wrap{display:flex;align-items:center;gap:8px}
input[type=range]{accent-color:var(--pu);cursor:pointer;width:130px;height:4px}
.rv{font-size:18px;font-weight:800;letter-spacing:-0.03em;color:var(--pu);min-width:50px;text-align:center}
/* Help */
.hs{display:flex;gap:14px;padding:14px;border:1px solid var(--bd);border-radius:10px;background:#fff;margin-bottom:8px;transition:.15s}.hs:hover{box-shadow:var(--sh-md);border-color:var(--pu-b)}
.hs-n{width:34px;height:34px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;flex-shrink:0}
.hs-t{font-size:13.5px;font-weight:700;letter-spacing:-0.02em;color:var(--tx);margin-bottom:4px}.hs-d{font-size:12.5px;color:var(--tx2);line-height:1.6;font-weight:400}
.gt{padding:8px 12px;border-left:3px solid var(--pu);background:var(--pu-l);border-radius:0 7px 7px 0;margin-bottom:8px}
.gt-n{font-size:13px;font-weight:700;letter-spacing:-0.02em;color:var(--pu);margin-bottom:2px}.gt-d{font-size:12px;color:var(--tx2);line-height:1.5;font-weight:400}
/* Archive */
.arc-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border:1px solid var(--bd);border-radius:8px;background:#fff;margin-bottom:8px;transition:.15s}
.arc-row:hover{border-color:var(--pu-b);box-shadow:var(--sh)}
.arc-wk{font-size:18px;font-weight:800;letter-spacing:-0.03em;color:var(--pu);min-width:48px}
.arc-dt{font-size:11px;color:var(--tx3);font-family:var(--mono);font-weight:500}
/* Util */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.fc{display:flex;align-items:center}.mla{margin-left:auto}
.mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}.mt14{margin-top:14px}.mt16{margin-top:16px}
.mb8{margin-bottom:8px}.mb10{margin-bottom:10px}.mb12{margin-bottom:12px}.mb14{margin-bottom:14px}
.w100{width:100%}.r8{border-radius:8px}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:#f1f5f9}::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#9ca3af}
@media(max-width:1100px){.k5,.k4{grid-template-columns:repeat(2,1fr)}}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(0);padding:11px 20px;border-radius:9px;font-size:13px;font-weight:600;color:#fff;z-index:2000;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tIn .2s ease;pointer-events:none;white-space:nowrap;letter-spacing:-0.01em;display:flex;align-items:center;gap:8px}
.toast-ok{background:#047857}.toast-ng{background:#dc2626}.toast-pu{background:#6d28d9}.toast-wr{background:#b45309}
@keyframes tIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

.logo-img{height:40px;width:40px;object-fit:cover;flex-shrink:0;border-radius:10px;display:block}
</style>
</style>
</head>

<input type="file" id="fi" accept=".xlsx,.xls" style="display:none" onchange="doImport(this)">
